<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 960" role="img"
  aria-labelledby="title desc">
  <title id="title">Cinco recortes observados entre Santos e Manaus</title>
  <desc id="desc">
    Cinco viagens são apresentadas em colunas verticais. Portos iguais ocupam
    a mesma linha horizontal. Cada trecho informa carga a bordo e distância.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17627f"/>
    </marker>
    <style>
      .background { fill: #ffffff; }
      .guide {
        stroke: #dfe8ed;
        stroke-width: 1;
        stroke-dasharray: 4 8;
      }
      .header {
        fill: #eef5f8;
        stroke: #17627f;
        stroke-width: 1.7;
      }
      .port {
        fill: #ffffff;
        stroke: #17627f;
        stroke-width: 1.8;
      }
      .route {
        fill: none;
        stroke: #17627f;
        stroke-width: 1.8;
        marker-end: url(#arrow);
      }
      .leg-background {
        fill: #ffffff;
        rx: 4;
      }
      text {
        fill: #17252f;
        font-family: Arial, Helvetica, sans-serif;
        text-anchor: middle;
      }
      .header-title {
        font-size: 18px;
        font-weight: 700;
      }
      .header-detail {
        font-size: 14px;
      }
      .port-label {
        font-size: 17px;
        font-weight: 700;
        dominant-baseline: middle;
      }
      .leg-label {
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </defs>

